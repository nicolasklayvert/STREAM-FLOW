<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow - Seu Centro de Entretenimento</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <a href="#" class="logo">
                <img src="images/LogoStreaming.png" alt="StreamFlow Logo">
            </a>
            <nav class="main-nav">
                <ul> 
                    <li><a href="#" class="active">Início</a></li>
                    <li><a href="#">Filmes</a></li>
                    <li><a href="#">Séries</a></li>
                    <li><a href="#">Jogos</a></li>
                    <li><a href="#">Músicas</a></li>
                    <li><a href="#">Central de Atendimento</a></li>
                </ul>
            </nav>
            <div class="user-menu">
                <input type="text" class="search-bar" placeholder="Pesquisar">
                <a href="perfil.html">

                </a>
                <img src="images/Bell.png" alt="Notificações" class="notification-bell">
            </div>
        </div>
    </header>

    <main>
        <section class="hero-section">

                <img src="images/Filme-Logo.png" alt="Studios Logo" class="hero-studio-logo">

                </div>

        <section class="carousel-section">

                </div>

                </div>

                </div>
                <div class="movie-poster">
                    <img src="images/image 11.png" alt="Pôster do Filme">
                </div>
                <div class="movie-poster">
                    <img src="images/image 16.png" alt="Pôster do Filme">
                </div>
                <div class="movie-poster">

                </div>
                <div class="movie-poster">
                    <img src="images/image 12.png" alt="Pôster do Filme">

                </div>

                </div>

                </div>
                 <div class="movie-poster">

                </div>

        </section>

        <section class="carousel-section">
            <h2>Séries</h2>
            <div class="movie-list">
                </div>
        </section>

</html>
